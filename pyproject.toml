[project]
name = "abyss"
version = "0.1.0"
description = "Render a scene from the viewer's point of view, tracked in real time."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.9",
    "opencv-contrib-python>=4.10",
    "pose-tools @ git+https://github.com/Pitrified/pose-tools@v0.4.0",
]

[project.urls]
Repository = "https://github.com/Pitrified/abyss"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abyss"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "notebook" },
    { include-group = "test" },
]
test = [
    "pytest>=8.3.4",
]
lint = [
    "ruff>=0.9.6",
    "pyright[nodejs]>=1.1.407",
    "pre-commit>=4.1.0",
    "detect-secrets>=1.5.0",
]
notebook = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "nbformat>=5.10.4",
    "nbstripout>=0.8.2",
    "rich>=13.9.4",
    "tqdm>=4.67.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
# remember to adjust include paths as needed (eg scripts folder)
include = ["src", "tests"]
