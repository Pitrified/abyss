<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>abyss</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <!-- The two large files, started now rather than once the modules have run.
       tasks-vision fetches them same-origin with credentials, as these do, so
       its own fetches are served from these instead of downloading again. -->
  <link rel="preload" href="/vendor/@mediapipe/tasks-vision/wasm/vision_wasm_internal.wasm" as="fetch" crossorigin>
  <link rel="preload" href="/models/face_landmarker.task" as="fetch" crossorigin>
  <script src="js/boot.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="view"></canvas>
  <canvas id="scene" hidden></canvas>
  <p id="status">starting</p>
  <p id="corner"><span id="version"></span> <button id="copy-log" type="button">log</button></p>
  <textarea id="log-out" readonly hidden></textarea>
</body>
</html>
